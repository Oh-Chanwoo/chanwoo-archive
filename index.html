<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오찬우 Archive</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-white: #FFFFFF;
      --ink-black: #0D0D0D;
      --ink-gray: #6B6B6B;
      --badge-gray: #E5E5E5;
      --line-light: #E2E2E2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-white);
      background-image: radial-gradient(var(--ink-black) 1.15px, transparent 1.15px);
      background-size: 20px 20px;
      color: var(--ink-black);
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      background: var(--bg-white);
      border-bottom: 2.5px solid var(--ink-black);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-emblem {
      background: var(--ink-black);
      color: var(--bg-white);
      width: 54px;
      height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      box-shadow: 3px 3px 0px #555555;
    }

    .logo-emblem .kr {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 900;
      font-size: 0.92rem;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .logo-emblem .divider {
      width: 28px;
      height: 1px;
      background: rgba(255, 255, 255, 0.45);
      margin: 4px 0;
    }

    .logo-emblem .arc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: #D4D4D4;
    }

    .brand-titles h1 {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      font-weight: 900;
      font-size: 1.45rem;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--ink-black);
    }

    .brand-titles .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      letter-spacing: 0.22em;
      color: var(--ink-gray);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .btn-upload-header {
      background: var(--ink-black);
      color: var(--bg-white);
      border: 2px solid var(--ink-black);
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 3px 0px #666666;
      transition: transform 0.12s ease;
      white-space: nowrap;
    }

    .btn-upload-header:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #666666;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .search-panel {
      background: var(--bg-white);
      border: 2.5px solid var(--ink-black);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: 7px 7px 0px var(--ink-black);
      position: relative;
      overflow: hidden;
    }

    .search-panel::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 155px;
      height: 135px;
      background-image: radial-gradient(#BDBDBD 1.3px, transparent 1.3px);
      background-size: 7px 7px;
      pointer-events: none;
      z-index: 0;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .search-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-white);
      border: 2px solid var(--ink-black);
      border-radius: 12px;
      padding: 0 12px;
      height: 46px;
    }

    .search-input-wrap svg {
      width: 18px;
      height: 18px;
      stroke: var(--ink-black);
      flex-shrink: 0;
      margin-right: 8px;
    }

    .search-input-wrap input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      color: var(--ink-black);
      background: transparent;
    }

    .search-input-wrap input::placeholder {
      color: #8E8E8E;
    }

    .btn-clear {
      background: var(--bg-white);
      color: var(--ink-black);
      border: 2px solid var(--ink-black);
      border-radius: 12px;
      height: 46px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0px 3.5px 0px var(--ink-black);
      transition: transform 0.1s ease;
      flex-shrink: 0;
    }

    .btn-clear:active {
      transform: translateY(2px);
      box-shadow: 0px 1.5px 0px var(--ink-black);
    }

    .panel-divider {
      border: none;
      border-top: 1px dashed #CCCCCC;
      margin: 18px 0 14px 0;
      position: relative;
      z-index: 1;
    }

    .tags-header {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .tags-header .square-bullet {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--ink-black);
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      position: relative;
      z-index: 1;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-white);
      border: 1.8px solid var(--ink-black);
      border-radius: 10px;
      padding: 6px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-black);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .tag-pill .count-badge {
      background: var(--badge-gray);
      color: var(--ink-black);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }

    .tag-pill:hover,
    .tag-pill.active {
      background: var(--ink-black);
      color: var(--bg-white);
    }

    .tag-pill:hover .count-badge,
    .tag-pill.active .count-badge {
      background: var(--bg-white);
      color: var(--ink-black);
    }

    .no-tags-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--ink-gray);
    }

    .upload-box {
      display: none;
      background: var(--bg-white);
      border: 2.5px solid var(--ink-black);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 26px;
      box-shadow: 6px 6px 0px var(--ink-black);
    }

    .upload-box.open {
      display: block;
    }

    .upload-box h2 {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--line-light);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-group input[type="text"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--ink-black);
      border-radius: 10px;
      font-size: 0.9rem;
      background: var(--bg-white);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--ink-gray);
      margin-top: 5px;
    }

    .upload-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-save {
      background: var(--ink-black);
      color: var(--bg-white);
      border: 2px solid var(--ink-black);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-cancel {
      background: var(--bg-white);
      color: var(--ink-black);
      border: 2px solid var(--ink-black);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .panel-card {
      background: var(--bg-white);
      border: 2.5px solid var(--ink-black);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 5px 5px 0px var(--ink-black);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      display: flex;
      flex-direction: column;
    }

    .panel-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px var(--ink-black);
    }

    .panel-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
      border-bottom: 2px solid var(--ink-black);
      background: #F4F4F4;
    }

    .card-tags {
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .mini-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      background: #F5F5F5;
      color: var(--ink-black);
      border: 1px solid var(--ink-black);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--bg-white);
      border: 2px dashed var(--ink-black);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.86rem;
      color: var(--ink-gray);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, 0.85);
      z-index: 60;
      padding: 18px;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-white);
      border: 2.5px solid var(--ink-black);
      border-radius: 18px;
      max-width: 780px;
      width: 100%;
      overflow: hidden;
      box-shadow: 8px 8px 0px var(--ink-black);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 2px solid var(--ink-black);
    }

    .modal-body {
      padding: 16px;
      text-align: center;
      background: #FAFAFA;
    }

    .modal-body img {
      max-width: 100%;
      max-height: 68vh;
      border: 2px solid var(--ink-black);
      border-radius: 8px;
    }

    .modal-footer {
      padding: 14px 16px;
      border-top: 2px solid var(--ink-black);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand-group">
        <div class="logo-emblem" aria-hidden="true">
          <span class="kr">오찬</span>
          <span class="divider"></span>
          <span class="arc">ARC</span>
        </div>
        <div class="brand-titles">
          <h1>오찬우<br>Archive</h1>
          <div class="subtitle">COLECCIÓN VISUAL</div>
        </div>
      </div>

      <button class="btn-upload-header" onclick="toggleUpload()">
        <span>+</span> Subir Imagen
      </button>
    </div>
  </header>

  <div class="container">
    <section id="uploadSection" class="upload-box">
      <h2>Subir nueva imagen a 오찬우 Archive</h2>
      <div class="form-group">
        <label for="fileInput">Selecciona tu imagen</label>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <div class="form-group">
        <label for="tagsInput">Tags (separados por espacio o coma)</label>
        <input type="text" id="tagsInput" placeholder="Ej: nombre_del_tag otro_tag" />
        <p class="hint">Se guardan limpios en minúsculas tal cual los escribas (ej: nombre_del_tag).</p>
      </div>
      <div class="upload-actions">
        <button class="btn-save" id="uploadBtn" onclick="uploadPost()">Guardar en la Galería</button>
        <button class="btn-cancel" onclick="toggleUpload()">Cancelar</button>
      </div>
      <p id="uploadStatus" class="status-msg"></p>
    </section>

    <section class="search-panel">
      <div class="search-row">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Buscar por tag... (ej: nombre_del_tag)" oninput="filterGallery()" />
        </div>
        <button class="btn-clear" onclick="clearSearch()">Limpiar</button>
      </div>

      <hr class="panel-divider" />

      <div class="tags-header">
        <span class="square-bullet"></span>
        <span>TAGS DISPONIBLES:</span>
      </div>

      <div class="tag-cloud" id="tagCloud">
        <span class="no-tags-hint">Cargando tags...</span>
      </div>
    </section>

    <main id="galleryGrid" class="gallery-grid"></main>
  </div>

  <div id="imageModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <strong>오찬우 Archive</strong>
        <button class="btn-cancel" style="padding:5px 12px; font-size:0.8rem;" onclick="forceCloseModal()">Cerrar ✕</button>
      </div>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Vista ampliada" />
      </div>
      <div class="modal-footer">
        <div id="modalTags" class="card-tags" style="padding:0;"></div>
        <div>
          <button class="btn-save" style="font-size:0.82rem; padding:8px 14px;" onclick="copyImageUrl()">Copiar enlace directo (para Bot)</button>
          <span id="copyFeedback" style="font-family:'JetBrains Mono',monospace; font-size:0.78rem; margin-left:8px; font-weight:700;"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ucabncmihjzwdjggxvwv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sZpAG4WxsKvy_zpoW5SiuA_7UYYllZf';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allPosts = [];
    let currentModalUrl = '';

    function toggleUpload() {
      document.getElementById('uploadSection').classList.toggle('open');
    }

    function normalizeTags(raw) {
      return raw
        .toLowerCase()
        .split(/[\s,]+/)
        .map(t => t.replace(/^#+/, '').trim())
        .filter(t => t.length > 0);
    }

    async function loadPosts() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '<div class="empty-state">Cargando archivo...</div>';

      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="empty-state">Error al conectar: ${error.message}<br><br>Verifica que SUPABASE_URL termine exactamente en .supabase.co</div>`;
        document.getElementById('tagCloud').innerHTML = '<span class="no-tags-hint">Sin conexión aún.</span>';
        return;
      }

      allPosts = data || [];
      renderTagCloud(allPosts);
      renderGallery(allPosts);
    }

    function renderTagCloud(posts) {
      const cloud = document.getElementById('tagCloud');
      const counts = {};

      posts.forEach(p => {
        const uniquePostTags = new Set(normalizeTags(p.tags || ''));
        uniquePostTags.forEach(t => {
          counts[t] = (counts[t] || 0) + 1;
        });
      });

      const sortedTags = Object.entries(counts).sort((a, b) => b[1] - a[1]);

      if (!sortedTags.length) {
        cloud.innerHTML = '<span class="no-tags-hint">Aún no hay tags. Aparecerán aquí con su contador en cuanto subas tu primera imagen.</span>';
        return;
      }

      const activeQuery = document.getElementById('searchInput').value.trim().toLowerCase().replace(/^#+/, '');
      cloud.innerHTML = '';

      sortedTags.forEach(([tag, count]) => {
        const btn = document.createElement('button');
        btn.className = 'tag-pill' + (activeQuery === tag ? ' active' : '');
        btn.innerHTML = `<span>${tag}</span><span class="count-badge">${count}</span>`;
        btn.onclick = () => {
          document.getElementById('searchInput').value = tag;
          filterGallery();
          renderTagCloud(allPosts);
        };
        cloud.appendChild(btn);
      });
    }

    function renderGallery(posts) {
      const grid = document.getElementById('galleryGrid');
      if (!posts.length) {
        grid.innerHTML = '<div class="empty-state">No hay imágenes para mostrar. ¡Toca "+ Subir Imagen" arriba para empezar!</div>';
        return;
      }

      grid.innerHTML = '';
      posts.forEach(post => {
        const tags = normalizeTags(post.tags || '');
        const card = document.createElement('div');
        card.className = 'panel-card';
        card.onclick = () => openModal(post.image_url, tags);

        card.innerHTML = `
          <img src="${post.image_url}" alt="오찬우 Archive" loading="lazy" />
          <div class="card-tags">
            ${tags.map(t => `<span class="mini-tag">${t}</span>`).join('')}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGallery() {
      const queryTerms = normalizeTags(document.getElementById('searchInput').value);
      if (!queryTerms.length) {
        renderGallery(allPosts);
        return;
      }

      const filtered = allPosts.filter(post => {
        const postTags = normalizeTags(post.tags || '');
        return queryTerms.every(q => postTags.some(pt => pt.includes(q)));
      });
      renderGallery(filtered);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderGallery(allPosts);
      renderTagCloud(allPosts);
    }

    async function uploadPost() {
      const fileInput = document.getElementById('fileInput');
      const tagsInput = document.getElementById('tagsInput');
      const status = document.getElementById('uploadStatus');
      const btn = document.getElementById('uploadBtn');

      const file = fileInput.files[0];
      const tagsList = normalizeTags(tagsInput.value);

      if (!file) {
        status.textContent = 'Selecciona una imagen primero.';
        return;
      }
      if (!tagsList.length) {
        status.textContent = 'Escribe al menos un tag para la imagen.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Subiendo imagen...';

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage
        .from('imagenes')
        .upload(fileName, file);

      if (uploadError) {
        status.textContent = `Error subiendo imagen: ${uploadError.message}`;
        btn.disabled = false;
        return;
      }

      const { data: urlData } = supabaseClient.storage
        .from('imagenes')
        .getPublicUrl(fileName);

      const { error: dbError } = await supabaseClient
        .from('posts')
        .insert([{ image_url: urlData.publicUrl, tags: tagsList.join(', ') }]);

      if (dbError) {
        status.textContent = `Error guardando tags: ${dbError.message}`;
        btn.disabled = false;
        return;
      }

      status.textContent = '¡Listo! Imagen guardada en 오찬우 Archive.';
      fileInput.value = '';
      tagsInput.value = '';
      btn.disabled = false;
      loadPosts();
    }

    function openModal(url, tags) {
      currentModalUrl = url;
      document.getElementById('modalImg').src = url;
      document.getElementById('copyFeedback').textContent = '';
      document.getElementById('modalTags').innerHTML = tags
        .map(t => `<span class="mini-tag">${t}</span>`)
        .join('');
      document.getElementById('imageModal').classList.add('open');
    }

    function closeModal(e) {
      if (e.target.id === 'imageModal') forceCloseModal();
    }

    function forceCloseModal() {
      document.getElementById('imageModal').classList.remove('open');
    }

    function copyImageUrl() {
      navigator.clipboard.writeText(currentModalUrl);
      document.getElementById('copyFeedback').textContent = '¡Enlace copiado!';
    }

    loadPosts();
  </script>
</body>
</html>
